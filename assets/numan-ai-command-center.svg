<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Numan Qureshi AI command center banner</title>
  <desc id="desc">A futuristic GitHub profile banner with a glowing NQ AI core, connected nodes, and a terminal-style developer identity panel.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071019"/>
      <stop offset="48%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#081722"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".15"/>
      <stop offset="45%" stop-color="#22D3EE" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#D8F7FF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".44"/>
      <stop offset="48%" stop-color="#163B65" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#58A6FF" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="1.5" y="1.5" width="1197" height="457" rx="28" fill="url(#bg)" stroke="#26384A" stroke-width="3"/>
  <rect x="2" y="2" width="1196" height="456" rx="27" fill="url(#grid)"/>
  <path d="M28 32H470L500 62V398L470 428H28" fill="none" stroke="url(#edge)" stroke-width="1.3"/>
  <path d="M536 32H1170V428H536L512 404V56Z" fill="#0B131D" fill-opacity=".82" stroke="#1F6F87" stroke-opacity=".5" stroke-width="1.2"/>

  <!-- LEFT: AI CORE -->
  <circle cx="260" cy="222" r="205" fill="url(#coreGlow)"/>

  <g opacity=".28" stroke="#22D3EE" stroke-width="1">
    <path d="M76 110L147 138L179 91L225 120"/>
    <path d="M85 325L146 294L194 343L240 315"/>
    <path d="M266 65L305 117L354 88L401 130"/>
    <path d="M303 333L350 369L399 326L448 348"/>
    <path d="M118 218L165 218"/>
    <path d="M355 218L438 218"/>
  </g>

  <g fill="#22D3EE" filter="url(#smallGlow)">
    <circle cx="76" cy="110" r="4"/><circle cx="147" cy="138" r="3"/>
    <circle cx="179" cy="91" r="3"/><circle cx="85" cy="325" r="4"/>
    <circle cx="146" cy="294" r="3"/><circle cx="194" cy="343" r="3"/>
    <circle cx="266" cy="65" r="4"/><circle cx="354" cy="88" r="3"/>
    <circle cx="401" cy="130" r="4"/><circle cx="350" cy="369" r="3"/>
    <circle cx="399" cy="326" r="3"/><circle cx="448" cy="348" r="4"/>
  </g>

  <circle cx="260" cy="218" r="130" fill="none" stroke="#58A6FF" stroke-opacity=".16" stroke-width="1"/>
  <circle cx="260" cy="218" r="112" fill="none" stroke="#22D3EE" stroke-opacity=".34" stroke-width="1.3" stroke-dasharray="10 8"/>
  <circle cx="260" cy="218" r="89" fill="#081520" stroke="#22D3EE" stroke-opacity=".65" stroke-width="1.8" filter="url(#smallGlow)"/>

  <path d="M260 119L336 163V251L260 295L184 251V163Z"
        fill="#0A1D29" stroke="#22D3EE" stroke-width="2.2" filter="url(#glow)"/>
  <path d="M260 136L321 171V242L260 277L199 242V171Z"
        fill="none" stroke="#58A6FF" stroke-opacity=".55" stroke-width="1.2"/>
  <path d="M217 184L260 159L303 184V234L260 259L217 234Z"
        fill="#0D1117" stroke="#22D3EE" stroke-opacity=".8" stroke-width="1.3"/>

  <text x="260" y="225" text-anchor="middle" fill="#E6FBFF" font-size="43" font-weight="800"
        font-family="'JetBrains Mono','Cascadia Code','Courier New',monospace" letter-spacing="2">NQ</text>
  <text x="260" y="247" text-anchor="middle" fill="#22D3EE" font-size="10"
        font-family="'JetBrains Mono','Cascadia Code','Courier New',monospace" letter-spacing="4">AI CORE</text>

  <g font-family="'JetBrains Mono','Cascadia Code','Courier New',monospace">
    <text x="52" y="66" fill="#8B949E" font-size="12" letter-spacing="2">NEURAL // SYSTEM</text>
    <text x="52" y="390" fill="#22D3EE" font-size="12" letter-spacing="2">● SYSTEM ONLINE</text>
    <text x="52" y="412" fill="#60788A" font-size="10" letter-spacing="1.5">BUILD · LEARN · SHIP · REPEAT</text>
  </g>

  <!-- RIGHT: TERMINAL PANEL -->
  <g font-family="'JetBrains Mono','Cascadia Code','Courier New',monospace">
    <circle cx="548" cy="60" r="5" fill="#FF6B6B"/>
    <circle cx="566" cy="60" r="5" fill="#FFD166"/>
    <circle cx="584" cy="60" r="5" fill="#2DD4BF"/>
    <text x="1138" y="65" text-anchor="end" fill="#60788A" font-size="13">git status --profile</text>

    <text x="552" y="120" fill="url(#titleGrad)" font-size="38" font-weight="800" letter-spacing="1.5">NUMAN QURESHI</text>
    <text x="553" y="151" fill="#22D3EE" font-size="17" font-weight="600" letter-spacing="3">AI SOFTWARE DEVELOPER</text>
    <line x1="552" y1="176" x2="1136" y2="176" stroke="#1F6F87" stroke-opacity=".7"/>

    <text x="552" y="216" fill="#58A6FF" font-size="14">&gt; focus</text>
    <text x="660" y="216" fill="#D6E6F2" font-size="16">AI · BACKEND · FULL STACK</text>

    <text x="552" y="254" fill="#58A6FF" font-size="14">&gt; stack</text>
    <text x="660" y="254" fill="#D6E6F2" font-size="16">Python · FastAPI · React</text>

    <text x="552" y="292" fill="#58A6FF" font-size="14">&gt; systems</text>
    <text x="660" y="292" fill="#D6E6F2" font-size="16">RAG · Search · Knowledge Graphs</text>

    <g transform="translate(552 324)">
      <rect x="0" y="0" width="96" height="30" rx="15" fill="#22D3EE" fill-opacity=".09" stroke="#22D3EE" stroke-opacity=".42"/>
      <text x="48" y="20" text-anchor="middle" fill="#BDF7FF" font-size="12">FASTAPI</text>
      <rect x="108" y="0" width="92" height="30" rx="15" fill="#58A6FF" fill-opacity=".08" stroke="#58A6FF" stroke-opacity=".35"/>
      <text x="154" y="20" text-anchor="middle" fill="#C8E7FF" font-size="12">REACT</text>
      <rect x="212" y="0" width="82" height="30" rx="15" fill="#22D3EE" fill-opacity=".08" stroke="#22D3EE" stroke-opacity=".35"/>
      <text x="253" y="20" text-anchor="middle" fill="#BDF7FF" font-size="12">RAG</text>
      <rect x="306" y="0" width="112" height="30" rx="15" fill="#58A6FF" fill-opacity=".08" stroke="#58A6FF" stroke-opacity=".35"/>
      <text x="362" y="20" text-anchor="middle" fill="#C8E7FF" font-size="12">NEO4J</text>
    </g>

    <rect x="552" y="382" width="584" height="34" rx="8" fill="#061019" stroke="#174B5D" stroke-opacity=".8"/>
    <text x="570" y="404" fill="#2DD4BF" font-size="13">&gt; building useful systems, one commit at a time</text>
    <rect x="1018" y="393" width="8" height="14" fill="#2DD4BF" opacity=".85"/>
  </g>

  <path d="M1180 92V50H1138" fill="none" stroke="#22D3EE" stroke-opacity=".55"/>
  <path d="M532 408H552" fill="none" stroke="#22D3EE" stroke-opacity=".55"/>
</svg>