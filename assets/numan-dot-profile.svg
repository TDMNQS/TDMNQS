<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Numan Qureshi dotted profile art</title>
  <desc id="desc">A terminal-inspired GitHub profile card with Numan Qureshi's GitHub avatar rendered through a dotted mask.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#101923"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <radialGradient id="glow" cx="33%" cy="50%" r="56%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".22"/>
      <stop offset="60%" stop-color="#163B65" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dotPattern" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="2.15" fill="white"/>
    </pattern>

    <mask id="dotMask">
      <rect width="100%" height="100%" fill="black"/>
      <circle cx="260" cy="230" r="177" fill="url(#dotPattern)"/>
    </mask>

    <clipPath id="photoClip">
      <circle cx="260" cy="230" r="178"/>
    </clipPath>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect x="1.5" y="1.5" width="1197" height="457" rx="26" fill="url(#bg)" stroke="#30363D" stroke-width="3"/>
  <rect width="1200" height="460" rx="26" fill="url(#glow)"/>

  <circle cx="260" cy="230" r="194" fill="#22D3EE" opacity=".10" filter="url(#softGlow)"/>
  <circle cx="260" cy="230" r="188" fill="none" stroke="#22D3EE" stroke-opacity=".42" stroke-width="1.5"/>
  <circle cx="260" cy="230" r="181" fill="none" stroke="#58A6FF" stroke-opacity=".18" stroke-width="1"/>

  <image href="https://avatars.githubusercontent.com/u/208779284?v=4"
         x="82" y="52" width="356" height="356"
         preserveAspectRatio="xMidYMid slice"
         clip-path="url(#photoClip)"
         opacity=".18"/>

  <image href="https://avatars.githubusercontent.com/u/208779284?v=4"
         x="82" y="52" width="356" height="356"
         preserveAspectRatio="xMidYMid slice"
         mask="url(#dotMask)"/>

  <g opacity=".42" fill="#22D3EE">
    <circle cx="54" cy="86" r="2"/><circle cx="67" cy="86" r="2"/><circle cx="80" cy="86" r="2"/>
    <circle cx="54" cy="99" r="2"/><circle cx="67" cy="99" r="2"/><circle cx="80" cy="99" r="2"/>
    <circle cx="54" cy="112" r="2"/><circle cx="67" cy="112" r="2"/><circle cx="80" cy="112" r="2"/>
    <circle cx="440" cy="348" r="2"/><circle cx="453" cy="348" r="2"/><circle cx="466" cy="348" r="2"/>
    <circle cx="440" cy="361" r="2"/><circle cx="453" cy="361" r="2"/><circle cx="466" cy="361" r="2"/>
    <circle cx="440" cy="374" r="2"/><circle cx="453" cy="374" r="2"/><circle cx="466" cy="374" r="2"/>
  </g>

  <line x1="510" y1="72" x2="510" y2="388" stroke="#30363D" stroke-width="1.5"/>

  <g font-family="'JetBrains Mono','Cascadia Code','Courier New',monospace">
    <text x="565" y="105" fill="#8B949E" font-size="20">numan@github:~$ whoami</text>
    <text x="565" y="158" fill="#FFFFFF" font-size="40" font-weight="700">NUMAN QURESHI</text>
    <text x="565" y="194" fill="#22D3EE" font-size="21" font-weight="600">AI SOFTWARE DEVELOPER</text>

    <text x="565" y="250" fill="#8B949E" font-size="18">focus</text>
    <text x="685" y="250" fill="#C9D1D9" font-size="18">AI · BACKEND · FULL STACK</text>

    <text x="565" y="286" fill="#8B949E" font-size="18">stack</text>
    <text x="685" y="286" fill="#C9D1D9" font-size="18">Python · FastAPI · React</text>

    <text x="565" y="322" fill="#8B949E" font-size="18">exploring</text>
    <text x="685" y="322" fill="#C9D1D9" font-size="18">RAG · Search · Knowledge Graphs</text>

    <text x="565" y="372" fill="#58A6FF" font-size="16">● building useful systems, one commit at a time</text>
  </g>

  <g transform="translate(1110 72)">
    <circle cx="0" cy="0" r="5" fill="#22D3EE"/>
    <circle cx="18" cy="0" r="5" fill="#58A6FF"/>
    <circle cx="36" cy="0" r="5" fill="#163B65"/>
  </g>
</svg>